# GitHub Actions CI/CD Pipeline for PolyInfer
# Cross-platform testing on Windows, Linux, and macOS
# Uses FREE GitHub Actions plan (GitHub-hosted runners, CPU-only)

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # Allow manual trigger

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1

jobs:
  # ============================================
  # Code Quality Checks (Fast, runs first)
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      # examples/ and scripts/ were previously unlinted, and had accumulated
      # 21 ruff violations including unused variables and bare zip() calls.
      - name: Run ruff linter
        run: ruff check src/ tests/ examples/ scripts/

      - name: Run ruff formatter check
        run: ruff format --check src/ tests/ examples/ scripts/

      - name: Byte-compile examples and scripts
        run: python -m compileall -q examples/ scripts/

      - name: Install package for type checking
        run: pip install -e .

      - name: Run mypy type checker
        run: mypy src/polyinfer/

  # ============================================
  # Cross-Platform Tests (CPU-only)
  # ============================================
  test:
    name: Test - Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: lint  # Only run tests if linting passes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # Only test one Python version on macOS to save minutes (10x cost)
          - os: macos-latest
            python-version: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: List available backends
        run: python -c "import polyinfer as pi; print('Available backends:', pi.list_backends()); print('Available devices:', pi.list_devices()); print('Unavailable:', pi.backend_errors())"

      # Fail loudly if no backend is usable. Otherwise every inference test
      # skips and the job still reports success, which is how a green CI
      # coexisted with zero inference coverage.
      - name: Assert at least one backend is available
        run: |
          python -c "
          import sys, polyinfer as pi
          backends = pi.list_backends()
          if not backends:
              print('No backends available:', pi.backend_errors())
              sys.exit(1)
          print('OK, backends available:', backends)
          "

      - name: Run CPU-only tests
        run: |
          pytest tests/ -v --tb=short -m "not (cuda or tensorrt or directml or intel_gpu or npu or vulkan or benchmark or slow)"

  # ============================================
  # Backend-Specific Tests (Optional CPU backends)
  # ============================================
  test-backends:
    name: Test - ${{ matrix.backend }} Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: openvino
            install: ".[openvino,dev]"
            marker: "openvino"
          - backend: iree
            install: ".[iree,dev]"
            marker: "iree"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package with ${{ matrix.backend }} backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "${{ matrix.install }}"

      - name: List available backends
        run: python -c "import polyinfer as pi; print('Available backends:', pi.list_backends()); print('Unavailable:', pi.backend_errors())"

      # The backend must actually be importable, otherwise this job silently
      # tested nothing. Previously the whole job was continue-on-error, so a
      # completely broken backend could not fail CI.
      - name: Assert ${{ matrix.backend }} is available
        run: |
          python -c "
          import sys, polyinfer as pi
          if '${{ matrix.backend }}' not in pi.list_backends():
              print('${{ matrix.backend }} unavailable:', pi.backend_errors())
              sys.exit(1)
          print('${{ matrix.backend }} is available')
          "

      # The full CPU suite, which exercises this backend through the shared
      # tests, plus the backend's own marker.
      - name: Run CPU suite with ${{ matrix.backend }} installed
        run: |
          pytest tests/ -v --tb=short -m "not (cuda or tensorrt or directml or intel_gpu or npu or vulkan or benchmark or slow)"

      - name: Run ${{ matrix.backend }}-marked tests
        run: |
          pytest tests/ -v --tb=short -m "${{ matrix.marker }} and not (cuda or tensorrt or directml or intel_gpu or npu or vulkan or benchmark or slow)"

  # ============================================
  # Build & Package Verification
  # ============================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package with twine
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ============================================
  # Windows DirectML Test (Windows-specific)
  # ============================================
  test-directml:
    name: Test - DirectML (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package with DirectML backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[amd,dev]"

      - name: List available backends
        run: python -c "import polyinfer as pi; print('Available backends:', pi.list_backends()); print('Available devices:', pi.list_devices())"

      - name: Run DirectML-compatible tests
        run: |
          pytest tests/ -v --tb=short -m "not (cuda or tensorrt or intel_gpu or npu or vulkan or benchmark or slow)"
        continue-on-error: true  # DirectML may not work on GitHub runners without GPU

  # ============================================
  # Summary Job (Required status check)
  # ============================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test, test-backends, build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint job failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test job failed"
            exit 1
          fi
          # test-backends is now gating. It was continue-on-error and absent
          # from this list, so an entirely broken OpenVINO or IREE backend
          # could not turn CI red.
          if [[ "${{ needs.test-backends.result }}" != "success" ]]; then
            echo "Backend test job failed"
            exit 1
          fi
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Build job failed"
            exit 1
          fi
          echo "All required jobs passed!"
